<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DECRYPT — Certificate Verification</title>
<meta name="description" content="Verify the authenticity of a DECRYPT 2.0 certificate.">
<meta name="theme-color" content="#07220C">
<script>try{var t=localStorage.getItem("decrypt-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2307220C'/%3E%3Ctext x='50' y='68' font-family='system-ui' font-size='50' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<style>
/* DECRYPT certificate verification — Ledger. Self-contained so it works from any host. */
@font-face { font-family: 'Agrandir'; src: url('assets/fonts/Agrandir-Wide.woff2') format('woff2'), url('assets/fonts/Agrandir-Wide.woff') format('woff'); font-weight: 700; font-display: swap; }
:root {
  --bg:#0A0B0A; --surface:#111311; --raise:#171A17; --line:#222722; --line-2:#2E352E;
  --text:#EDF0EC; --text-2:#A3ACA4; --muted:#6E776F;
  --accent:#3DDC7A; --accent-ink:#04130A; --accent-soft:rgba(61,220,122,.12);
  --brand:#07220C; --hi:#7BF0A6; --red:#E5604D; --amber:#E8B33B;
  --font-d:'Agrandir','Schibsted Grotesk',system-ui,sans-serif;
  --font-b:'Schibsted Grotesk',system-ui,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,monospace;
}
:root[data-theme="light"] {
  --bg:#F1F2EE; --surface:#FFFFFF; --raise:#F6F7F4; --line:#DFE2DB; --line-2:#C9CEC4;
  --text:#0C1410; --text-2:#4B574E; --muted:#7A857D;
  --accent:#0C7A36; --accent-ink:#fff; --accent-soft:rgba(12,122,54,.09); --red:#C23B29; --amber:#9A6A00;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font-b); background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
.bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 clamp(16px,4vw,32px); height:60px; border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:11px; }
.mark { width:30px; height:30px; border-radius:8px; background:var(--brand); border:1px solid rgba(255,255,255,.14); color:#fff; display:grid; place-items:center; font-weight:800; font-size:.86rem; letter-spacing:-.04em; }
.brand-name { font-family:var(--font-d); font-weight:700; letter-spacing:.08em; font-size:.92rem; }
.label { font-family:var(--font-m); font-size:.64rem; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.theme { width:34px; height:34px; border-radius:8px; display:grid; place-items:center; color:var(--text-2); background:none; border:0; cursor:pointer; }
.theme:hover { background:var(--raise); color:var(--text); }
.theme svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; }

main { flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
.card { width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; animation:rise .45s cubic-bezier(.16,1,.3,1); }
@keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

/* status head: brand surface for success, flat tint otherwise */
.head { padding:26px 26px 24px; display:flex; flex-direction:column; gap:10px; border-bottom:1px solid var(--line); }
.head.ok { background:var(--brand); color:#fff; border-bottom-color:rgba(255,255,255,.12); }
.head .tag { display:inline-flex; align-items:center; gap:8px; font-family:var(--font-m); font-size:.66rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
.head .tag::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
.head.ok .tag { color:var(--hi); }
.head.bad .tag { color:var(--red); } .head.warn .tag { color:var(--amber); } .head.info .tag { color:var(--accent); }
.title { font-family:var(--font-d); font-size:clamp(1.55rem,5.4vw,2rem); font-weight:700; letter-spacing:-.035em; line-height:1.05; }
.sub { font-size:.9rem; line-height:1.55; color:var(--text-2); max-width:380px; }
.head.ok .sub { color:rgba(255,255,255,.72); }

.rows { padding:4px 0; }
.row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 26px; border-bottom:1px solid var(--line); }
.row:last-child { border-bottom:0; }
.k { font-family:var(--font-m); font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); flex-shrink:0; }
.v { font-size:.92rem; text-align:right; font-weight:500; word-break:break-word; }
.v.mono { font-family:var(--font-m); font-size:.82rem; color:var(--accent); font-weight:500; }

.loading { padding:60px 26px; display:flex; flex-direction:column; align-items:center; gap:14px; }
.spin { width:28px; height:28px; border-radius:50%; border:2px solid var(--line-2); border-top-color:var(--accent); animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg) } }

.lookup { padding:22px 26px 26px; display:flex; flex-direction:column; gap:10px; }
.lookup input { background:var(--bg); border:1px solid var(--line-2); color:var(--text); padding:12px 14px; border-radius:8px; font-family:var(--font-m); font-size:.9rem; letter-spacing:.06em; text-transform:uppercase; }
.lookup input::placeholder { color:var(--muted); text-transform:none; letter-spacing:0; }
.lookup input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.lookup button { height:42px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink); font-family:var(--font-b); font-weight:600; font-size:.9rem; cursor:pointer; }
.lookup button:hover { filter:brightness(1.08); }
.foot { padding:0 16px 28px; text-align:center; }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important} }
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><span class="mark">D.</span><span class="brand-name">DECRYPT</span></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="label">Certificate verification</span>
    <button class="theme" id="theme" type="button" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>

<main>
  <div class="card" id="card">
    <div class="loading"><div class="spin"></div><p class="label">Verifying certificate…</p></div>
  </div>
</main>

<p class="foot label">DECRYPT 2.0 · Knowledge should not stay locked.</p>

<script>
var API = 'https://script.google.com/macros/s/AKfycbxhx5PmRQ3bJdKLyW0Bia-t5b0dNcy---geQJtGNrwOh6l8BylVdVotY9gAaQL8AzydLQ/exec';

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function row(key, val, mono) {
  return '<div class="row"><span class="k">' + esc(key) + '</span><span class="v' + (mono ? ' mono' : '') + '">' + esc(val) + '</span></div>';
}
function head(kind, tag, title, sub) {
  return '<div class="head ' + kind + '"><span class="tag">' + esc(tag) + '</span>' +
    '<h1 class="title">' + esc(title) + '</h1><p class="sub">' + esc(sub) + '</p></div>';
}
function show(html) { document.getElementById('card').innerHTML = html; }

function renderVerified(d) {
  document.title = 'Verified — ' + d.name + ' · DECRYPT';
  show(head('ok', 'Verified', 'Certificate verified', 'This is an authentic DECRYPT certificate. The details below match our records.') +
    '<div class="rows">' + row('Name', d.name) + row('Event', d.event) + row('Track', d.track) + row('Date', d.date) + row('Certificate ID', d.code, true) + '</div>');
}
function renderNotAttended(code) {
  document.title = 'Not valid — DECRYPT';
  show(head('warn', 'Not valid', 'Certificate not valid', 'This code is registered, but the participant did not attend DECRYPT 2.0. No certificate was issued for it.') +
    '<div class="rows">' + row('Code checked', code, true) + '</div>');
}
function renderNotFound(code) {
  document.title = 'Not found — DECRYPT';
  show(head('bad', 'Not found', 'Certificate not found', 'This code does not match any certificate we have issued. If you think this is a mistake, contact the DECRYPT team.') +
    '<div class="rows">' + row('Code checked', code || '—', !!code) + '</div>' +
    '<div class="lookup"><input type="text" id="manual-code" placeholder="Try another code" autocapitalize="characters" spellcheck="false"><button type="button" onclick="manualLookup()">Check again</button></div>');
  bindEnter();
}
function renderError(msg) {
  show(head('bad', 'Error', 'Verification unavailable', msg || 'Could not reach the verification server. Check your connection and try again.') +
    '<div class="lookup"><input type="text" id="manual-code" placeholder="Enter certificate code" autocapitalize="characters" spellcheck="false"><button type="button" onclick="manualLookup()">Try again</button></div>');
  bindEnter();
}
function renderLookupForm() {
  show(head('info', 'Verify', 'Verify a certificate', 'Enter the certificate ID printed on the certificate, or scan its QR code.') +
    '<div class="lookup"><input type="text" id="manual-code" placeholder="e.g. DEC2.O-8F3KQ" autocapitalize="characters" spellcheck="false"><button type="button" onclick="manualLookup()">Verify</button></div>');
  bindEnter();
  var i = document.getElementById('manual-code'); if (i) i.focus();
}
function bindEnter() {
  var i = document.getElementById('manual-code');
  if (i) i.addEventListener('keydown', function (e) { if (e.key === 'Enter') manualLookup(); });
}
function manualLookup() {
  var i = document.getElementById('manual-code');
  var code = i ? i.value.trim().toUpperCase() : '';
  if (code) verify(code);
}

function verify(code) {
  show('<div class="loading"><div class="spin"></div><p class="label">Verifying ' + esc(code) + '…</p></div>');
  fetch(API + '?action=verify_certificate&code=' + encodeURIComponent(code))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.verified === true) return renderVerified(d);
      if (d && d.reason === 'not_attended') return renderNotAttended(code);
      /* Only a real "verified:false" answer from the verifier means not found.
         Anything else (e.g. the server ran a different route) is a setup problem, not a bad code. */
      if (d && d.verified === false) return renderNotFound(code);
      renderError('The server answered, but not with a verification result. The team needs to check that the verify route is enabled.');
    })
    .catch(function () { renderError(); });
}

(function () {
  var t = document.getElementById('theme');
  t.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('decrypt-theme', next); } catch (e) {}
  });
  var code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
  if (code) verify(code); else renderLookupForm();
})();
</script>
</body>
</html>
